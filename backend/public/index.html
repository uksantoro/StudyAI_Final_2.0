<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyAI</title>
<style>
:root{--bg:#f5f6fb;--panel:#fff;--ink:#10152b;--muted:#68708a;--line:#e6e8f0;--purple:#6d4aff;--blue:#2e8bff;--navy:#0d1328;--grad:linear-gradient(135deg,#35227f,#6847ff);--shadow:0 16px 45px rgba(29,22,79,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#fff;padding:22px 16px;z-index:20}.brand{font-size:25px;font-weight:900;padding:8px 12px 28px}.brand span{color:#7d62ff}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#dbe0f4;text-align:left;padding:12px 14px;border-radius:12px}.nav button:hover,.nav button.active{background:#6847ff;color:#fff}.nav-bottom{position:absolute;bottom:20px;left:16px;right:16px}.main{margin-left:250px;min-height:100vh;padding:24px 28px 90px}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px}.search{flex:1;max-width:600px;position:relative}.search input{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:none}.user{margin-left:auto;display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800}.hero{background:var(--grad);color:#fff;border-radius:25px;padding:28px 30px;box-shadow:var(--shadow);margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#eeeaff}.btn{padding:11px 16px;border-radius:12px;background:var(--purple);color:#fff;font-weight:800}.btn.light{background:#fff;color:var(--purple)}.btn.ghost{background:#f1efff;color:#5136d5}.btn.danger{background:#ffe9ec;color:#b21d3a}.btn.small{padding:8px 11px;font-size:13px}.grid{display:grid;gap:18px}.courses{grid-template-columns:repeat(4,minmax(0,1fr))}.course-card{border-radius:20px;padding:20px;color:#fff;min-height:145px;box-shadow:var(--shadow);position:relative;overflow:hidden}.course-card:nth-child(4n+1){background:linear-gradient(135deg,#7b45ff,#4d22d9)}.course-card:nth-child(4n+2){background:linear-gradient(135deg,#1593ff,#2265e8)}.course-card:nth-child(4n+3){background:linear-gradient(135deg,#1fc37b,#0b9b62)}.course-card:nth-child(4n){background:linear-gradient(135deg,#ff9b25,#f04430)}.course-card h3{margin:25px 0 5px;font-size:20px}.course-card p{margin:0;opacity:.9}.course-card .actions{position:absolute;right:15px;top:15px;display:flex;gap:6px}.section{margin:26px 0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section h2{margin:0;font-size:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(20,20,50,.04)}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,1fr)}.lesson-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.lesson-row:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:12px;background:#f0edff;color:var(--purple);display:grid;place-items:center;font-weight:900}.grow{flex:1}.muted{color:var(--muted);font-size:13px}.progress{height:10px;background:#eceef5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d4aff,#31c6a2);border-radius:99px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{font-size:27px}.stat span{display:block;color:var(--muted);font-size:13px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;outline:none;background:#fff}.form textarea{min-height:130px;resize:vertical}.modal-back{position:fixed;inset:0;background:rgba(8,10,25,.58);display:grid;place-items:center;padding:18px;z-index:50}.modal{background:#fff;border-radius:20px;width:min(560px,100%);padding:24px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.lesson-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.tab{white-space:nowrap;padding:10px 13px;border-radius:11px;background:#f0eff8;color:#555}.tab.active{background:var(--purple);color:#fff}.audio{display:grid;gap:12px}.audio audio{width:100%}.concepts{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:7px 10px;background:#eeeaff;color:#4d35c5;border-radius:999px;font-size:13px}.map{min-height:330px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at center,#f4f0ff,transparent 55%)}.map .center{padding:18px 24px;background:var(--purple);color:#fff;border-radius:16px;font-weight:900;z-index:2}.map .node{position:absolute;padding:12px 15px;background:#fff;border:1px solid #ddd7ff;border-radius:13px;box-shadow:var(--shadow);font-size:13px}.n1{top:28px;left:15%}.n2{top:34px;right:15%}.n3{bottom:35px;left:17%}.n4{bottom:32px;right:15%}.flash{min-height:230px;display:grid;place-items:center;text-align:center}.flash h2{font-size:25px}.quiz-option{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid var(--line);background:#fff;border-radius:11px}.quiz-option.selected{border-color:var(--purple);background:#f0edff}.chat{min-height:360px;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 14px;border-radius:15px;max-width:85%;background:#f0edff}.bubble.me{align-self:flex-end;background:#6d4aff;color:#fff}.chat-input{display:flex;gap:8px;margin-top:auto}.chat-input input{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px}.toast{position:fixed;right:20px;bottom:20px;background:#12162b;color:#fff;padding:13px 16px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.empty{text-align:center;padding:35px;color:var(--muted)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0d1328,#35227f 55%,#6d4aff)}.login{width:min(440px,100%);background:#fff;border-radius:25px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.login .brand{color:var(--ink);padding:0 0 15px}.result-list{position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;max-height:350px;overflow:auto}.result{padding:11px 14px;border-bottom:1px solid var(--line)}.result:hover{background:#f6f4ff}.mobile-nav{display:none}
@media(max-width:1100px){.courses{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{display:none}.main{margin-left:0;padding:15px 14px 88px}.topbar{margin-bottom:16px}.topbar .search{max-width:none}.user{display:none}.hero{padding:22px;border-radius:20px}.hero h1{font-size:25px}.courses{grid-template-columns:repeat(2,1fr);gap:10px}.course-card{min-height:125px;padding:15px;border-radius:16px}.course-card h3{font-size:16px;margin-top:23px}.stats{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:8px;right:8px;bottom:8px;background:#10152b;color:#fff;border-radius:18px;padding:7px;z-index:40;box-shadow:0 10px 35px rgba(0,0,0,.25)}.mobile-nav button{background:transparent;color:#cdd2e8;font-size:11px;padding:7px 3px}.mobile-nav button.active{background:#6d4aff;color:#fff;border-radius:12px}.section-head{gap:10px}.lesson-row{align-items:flex-start}.lesson-row .btn{font-size:12px;padding:8px}.panel{padding:15px}.map{min-height:280px}.n1,.n3{left:4%}.n2,.n4{right:4%}.search input{padding:12px}.lesson-tabs{margin:0 -5px}.lesson-tabs .tab{font-size:12px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const API="/api"; let token=localStorage.getItem("studyai_final_token"); let state={view:"dashboard",data:null,lesson:null,tab:"audio",flashIndex:0,quizIndex:0,quizScore:0,quizAnswers:{}};
const $=s=>document.querySelector(s);
async function api(path,opts={}){const h=opts.headers||{}; if(!(opts.body instanceof FormData))h["Content-Type"]="application/json"; if(token)h.Authorization="Bearer "+token; const r=await fetch(API+path,{...opts,headers:h}); let d={}; try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.error||"Errore"); return d}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function modal(title,body){const x=document.createElement("div");x.className="modal-back";x.innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="btn ghost small" data-close>✕</button></div>${body}</div>`;document.body.appendChild(x);x.onclick=e=>{if(e.target===x||e.target.closest("[data-close]"))x.remove()};return x}
function nav(){return `<aside class="sidebar"><div class="brand">Study<span>AI</span> 🎓</div><div class="nav">${navBtn("dashboard","⌂","Home")}${navBtn("courses","▣","Corsi")}${navBtn("lessons","▤","Lezioni")}${navBtn("notes","▱","Appunti")}${navBtn("quiz","◈","Quiz")}${navBtn("maps","⌘","Mappe")}${navBtn("stats","▥","Statistiche")}</div><div class="nav nav-bottom">${navBtn("settings","⚙","Impostazioni")}<button id="logout">↪ Esci</button></div></aside><nav class="mobile-nav">${navBtn("dashboard","⌂","Home")}${navBtn("courses","▣","Corsi")}${navBtn("lessons","▤","Lezioni")}${navBtn("quiz","◈","Quiz")}${navBtn("stats","⋯","Altro")}</nav>`}
function navBtn(v,i,t){return `<button class="${state.view===v?"active":""}" data-nav="${v}">${i} <span>${t}</span></button>`}
function layout(content){return `<div class="app">${nav()}<main class="main"><div class="topbar"><div class="search"><input id="search" placeholder="Cerca lezioni, appunti, corsi..." autocomplete="off"><div id="results" class="result-list hidden"></div></div><div class="user"><div class="avatar">${esc((state.me?.name||"S").slice(0,1).toUpperCase())}</div><b>${esc(state.me?.name||"Studente")}</b></div></div>${content}</main></div>`}
function bindCommon(){document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;render()});$("#logout")?.addEventListener("click",()=>{localStorage.removeItem("studyai_final_token");location.reload()});$("#search")?.addEventListener("input",async e=>{const q=e.target.value.trim();const box=$("#results");if(q.length<2){box.classList.add("hidden");return}try{const r=await api("/search?q="+encodeURIComponent(q));box.innerHTML=r.length?r.map(x=>`<div class="result" data-result="${x.type}" data-id="${x.id}"><b>${esc(x.title)}</b><div class="muted">${esc(x.subtitle||x.type)}</div></div>`).join(""):`<div class="empty">Nessun risultato</div>`;box.classList.remove("hidden");box.querySelectorAll(".result").forEach(x=>x.onclick=()=>openResult(x.dataset.result,x.dataset.id))}catch{} });}
async function openResult(type,id){$("#results")?.classList.add("hidden");if(type==="course"){state.view="course";state.courseId=id;render()}else if(type==="lesson"){state.view="lesson";state.lessonId=id;await loadLesson()}else{state.view="courses";render()}}
async function render(){if(!token){renderLogin();return} try{state.me=await api("/me")}catch{localStorage.removeItem("studyai_final_token");token=null;return render()} if(state.view==="lesson"&&state.lessonId)return loadLesson(); if(state.view==="course"&&state.courseId)return loadCourse(); if(state.view==="courses")return loadCourses(); if(state.view==="stats")return loadStats(); if(["lessons","notes","quiz","maps"].includes(state.view))return loadCategory(); return loadDashboard()}
function renderLogin(){document.body.innerHTML=`<div class="login-wrap"><div class="login"><div class="brand">Study<span>AI</span> 🎓</div><p class="muted">Il tuo studio, semplice e intelligente.</p><form id="loginForm" class="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (min. 6 caratteri)" required><div style="display:flex;gap:8px"><button class="btn" type="submit">Accedi</button><button class="btn ghost" type="button" id="register">Crea account</button></div><div id="loginErr" class="muted"></div></form></div></div>`;$("#loginForm").onsubmit=async e=>{e.preventDefault();try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#password").value})});token=d.token;localStorage.setItem("studyai_final_token",token);state.view="dashboard";render()}catch(err){$("#loginErr").textContent=err.message}};$("#register").onclick=async()=>{try{const d=await api("/auth/register",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#password").value})});token=d.token;localStorage.setItem("studyai_final_token",token);render()}catch(err){$("#loginErr").textContent=err.message}}}
async function loadDashboard(){const d=await api("/dashboard");state.data=d;const c=d.courses;document.getElementById("root").innerHTML=layout(`<section class="hero"><h1>Ciao, ${esc(state.me.name)} 👋</h1><p>Organizza il tuo studio, un passo alla volta.</p></section><div class="section-head"><h2>I miei corsi</h2><button class="btn" id="addCourse">＋ Aggiungi corso</button></div><div class="grid courses">${c.length?c.map(courseCard).join(""):`<div class="panel empty" style="grid-column:1/-1">Crea il tuo primo corso per iniziare.</div>`}</div><div class="grid two section"><div class="panel"><div class="section-head"><h2>Lezioni recenti</h2></div>${d.lessons.length?d.lessons.map(lessonRow).join(""):`<div class="empty">Nessuna lezione ancora.</div>`}</div><div class="panel"><div class="section-head"><h2>Stato dello studio</h2></div><div class="stats"><div class="stat"><strong>${d.stats.percent}%</strong><span>Completato</span></div><div class="stat"><strong>${d.stats.done}</strong><span>Lezioni completate</span></div><div class="stat"><strong>${d.stats.total}</strong><span>Lezioni totali</span></div><div class="stat"><strong>AI</strong><span>Pronta per l'integrazione</span></div></div><div style="margin-top:20px" class="progress"><i style="width:${d.stats.percent}%"></i></div></div></div>`);bindCommon();$("#addCourse").onclick=()=>courseModal();bindRows()}
function courseCard(c){return `<div class="course-card"><div class="actions"><button class="btn light small" data-edit-course="${c.id}">✎</button><button class="btn danger small" data-del-course="${c.id}">×</button></div><h3>${esc(c.name)}</h3><p>${esc(c.university||"Università")} · ${c.lesson_count} lezioni</p><button class="btn light small" style="margin-top:16px" data-open-course="${c.id}">Apri →</button></div>`}
function lessonRow(l){return `<div class="lesson-row"><div class="icon">▶</div><div class="grow"><b>${esc(l.title)}</b><div class="muted">${esc(l.course_name||"")} · ${esc(l.subject_name||"")}</div></div><button class="btn small" data-open-lesson="${l.id}">Apri</button></div>`}
function bindRows(){document.querySelectorAll("[data-open-course]").forEach(b=>b.onclick=()=>{state.courseId=b.dataset.openCourse;state.view="course";render()});document.querySelectorAll("[data-open-lesson]").forEach(b=>b.onclick=()=>{state.lessonId=b.dataset.openLesson;state.view="lesson";render()});document.querySelectorAll("[data-edit-course]").forEach(b=>b.onclick=async()=>{const c=(await api("/courses")).find(x=>x.id==b.dataset.editCourse);courseModal(c)});document.querySelectorAll("[data-del-course]").forEach(b=>b.onclick=async()=>{if(confirm("Eliminare corso e tutte le sue materie e lezioni?")){await api("/courses/"+b.dataset.delCourse,{method:"DELETE"});render()}})}
function courseModal(c){const m=modal(c?"Modifica corso":"Nuovo corso",`<form class="form" id="f"><input id="n" placeholder="Nome corso" value="${esc(c?.name||"")}" required><input id="u" placeholder="Università" value="${esc(c?.university||"")}"><input id="col" type="color" value="${c?.color||"#6d4aff"}"><button class="btn">${c?"Salva":"Crea corso"}</button></form>`);m.querySelector("#f").onsubmit=async e=>{e.preventDefault();const body={name:m.querySelector("#n").value,university:m.querySelector("#u").value,color:m.querySelector("#col").value};await api(c?"/courses/"+c.id:"/courses",{method:c?"PATCH":"POST",body:JSON.stringify(body)});m.remove();render()}}
async function loadCourses(){const cs=await api("/courses");document.getElementById("root").innerHTML=layout(`<div class="section-head"><h2>I miei corsi</h2><button class="btn" id="addCourse">＋ Aggiungi corso</button></div><div class="grid courses">${cs.length?cs.map(courseCard).join(""):`<div class="panel empty" style="grid-column:1/-1">Nessun corso.</div>`}</div>`);bindCommon();$("#addCourse").onclick=()=>courseModal();bindRows()}
async function loadCourse(){const d=await api("/courses/"+state.courseId);state.course=d;document.getElementById("root").innerHTML=layout(`<button class="btn ghost small" id="back">← Dashboard</button><section class="hero" style="margin-top:16px"><h1>${esc(d.course.name)}</h1><p>${esc(d.course.university||"Università")}</p><div style="margin-top:15px"><button class="btn light small" id="editCourse">✎ Modifica</button> <button class="btn danger small" id="delCourse">Elimina</button></div></section><div class="section-head"><h2>Materie</h2><button class="btn" id="addSubject">＋ Materia</button></div><div class="grid two">${d.subjects.length?d.subjects.map(s=>`<div class="panel"><div class="section-head"><div><h3 style="margin:0">${esc(s.name)}</h3><span class="muted">${s.lesson_count} lezioni</span></div><div><button class="btn ghost small" data-edit-sub="${s.id}">✎</button><button class="btn danger small" data-del-sub="${s.id}">×</button></div></div><button class="btn small" data-open-sub="${s.id}">Apri materia</button></div>`).join(""):`<div class="panel empty" style="grid-column:1/-1">Crea la prima materia.</div>`}</div>`);bindCommon();$("#back").onclick=()=>{state.view="dashboard";render()};$("#editCourse").onclick=()=>courseModal(d.course);$("#delCourse").onclick=async()=>{if(confirm("Eliminare definitivamente il corso?")){await api("/courses/"+d.course.id,{method:"DELETE"});state.view="dashboard";render()}};$("#addSubject").onclick=()=>subjectModal(d.course.id);document.querySelectorAll("[data-open-sub]").forEach(b=>b.onclick=()=>{state.subjectId=b.dataset.openSub;loadSubject()});document.querySelectorAll("[data-edit-sub]").forEach(b=>b.onclick=async()=>subjectModal(d.course.id,d.subjects.find(s=>s.id==b.dataset.editSub)));document.querySelectorAll("[data-del-sub]").forEach(b=>b.onclick=async()=>{if(confirm("Eliminare materia e lezioni?")){await api("/subjects/"+b.dataset.delSub,{method:"DELETE"});loadCourse()}})}
function subjectModal(courseId,s){const m=modal(s?"Modifica materia":"Nuova materia",`<form class="form" id="f"><input id="n" placeholder="Nome materia" value="${esc(s?.name||"")}" required><input id="col" type="color" value="${s?.color||"#6d4aff"}"><button class="btn">${s?"Salva":"Crea materia"}</button></form>`);m.querySelector("#f").onsubmit=async e=>{e.preventDefault();const body={name:m.querySelector("#n").value,color:m.querySelector("#col").value};await api(s?"/subjects/"+s.id:"/courses/"+courseId+"/subjects",{method:s?"PATCH":"POST",body:JSON.stringify(body)});m.remove();loadCourse()}}
async function loadSubject(){const d=await api("/subjects/"+state.subjectId);document.getElementById("root").innerHTML=layout(`<button class="btn ghost small" id="back">← Corso</button><section class="hero" style="margin-top:16px"><h1>${esc(d.subject.name)}</h1><p>${esc(d.subject.course_name)}</p></section><div class="section-head"><h2>Lezioni</h2><button class="btn" id="addLesson">＋ Lezione</button></div><div class="panel">${d.lessons.length?d.lessons.map(l=>`<div class="lesson-row"><div class="icon">${l.audio_name?"🎙️":"▤"}</div><div class="grow"><b>${esc(l.title)}</b><div class="muted">Lezione ${esc(l.lesson_number||"—")} · ${esc(l.date||"")}</div></div><button class="btn ghost small" data-edit-lesson="${l.id}">✎</button><button class="btn danger small" data-del-lesson="${l.id}">×</button><button class="btn small" data-open-lesson="${l.id}">Apri</button></div>`).join(""):`<div class="empty">Nessuna lezione.</div>`}</div>`);bindCommon();$("#back").onclick=()=>{state.view="course";state.courseId=d.subject.course_id;render()};$("#addLesson").onclick=()=>lessonModal(d.subject.id);document.querySelectorAll("[data-open-lesson]").forEach(b=>b.onclick=()=>{state.lessonId=b.dataset.openLesson;state.view="lesson";render()});document.querySelectorAll("[data-edit-lesson]").forEach(b=>b.onclick=async()=>lessonModal(d.subject.id,await api("/lessons/"+b.dataset.editLesson).then(x=>x.lesson)));document.querySelectorAll("[data-del-lesson]").forEach(b=>b.onclick=async()=>{if(confirm("Eliminare la lezione?")){await api("/lessons/"+b.dataset.delLesson,{method:"DELETE"});loadSubject()}})}
function lessonModal(subjectId,l){const m=modal(l?"Modifica lezione":"Nuova lezione",`<form class="form" id="f"><input id="t" placeholder="Titolo lezione" value="${esc(l?.title||"")}" required><input id="n" placeholder="Numero lezione" value="${esc(l?.lesson_number||"")}"><input id="d" type="date" value="${esc(l?.date||"")}"><button class="btn">${l?"Salva":"Crea lezione"}</button></form>`);m.querySelector("#f").onsubmit=async e=>{e.preventDefault();const body={title:m.querySelector("#t").value,lesson_number:m.querySelector("#n").value,date:m.querySelector("#d").value};await api(l?"/lessons/"+l.id:"/subjects/"+subjectId+"/lessons",{method:l?"PATCH":"POST",body:JSON.stringify(body)});m.remove();loadSubject()}}
async function loadLesson(){const d=await api("/lessons/"+state.lessonId);state.lesson=d;document.getElementById("root").innerHTML=layout(lessonHTML(d));bindCommon();bindLesson()}
function lessonHTML(d){const l=d.lesson;return `<button class="btn ghost small" id="backLesson">← Torna alla materia</button><section class="hero" style="margin-top:16px"><div class="muted" style="color:#ddd">Lezione · ${esc(l.course_name)} · ${esc(l.subject_name)}</div><h1>${esc(l.title)}</h1><p>${esc(l.date||"")}</p><div style="margin-top:15px"><button class="btn light small" id="complete">${l.completed?"✓ Completata":"Segna come completata"}</button></div></section><div class="lesson-tabs">${["audio","transcript","summary","concepts","map","flashcards","quiz","tutor"].map(t=>`<button class="tab ${state.tab===t?"active":""}" data-tab="${t}">${{audio:"🎙️ Audio",transcript:"Trascrizione",summary:"Riassunto",concepts:"Concetti",map:"Mappa",flashcards:"Flashcard",quiz:"Quiz",tutor:"Tutor AI"}[t]}</button>`).join("")}</div><div class="section" id="lessonContent">${lessonTab(d)}</div>`}
function lessonTab(d){const l=d.lesson;if(state.tab==="audio")return `<div class="grid two"><div class="panel"><h2>Registrazione</h2>${l.audio_path?`<p class="muted">${esc(l.audio_name||"Audio")}</p><audio class="audio" controls src="/${esc(l.audio_path).replace(/\\\\/g,"/")}"></audio><button class="btn danger small" id="removeAudio">Rimuovi registrazione</button>`:`<div class="empty">Nessuna registrazione caricata.</div>`}<form id="audioForm" style="margin-top:15px"><input type="file" id="audioFile" accept=".mp3,.wav,.m4a,.ogg,.webm,audio/*" required><button class="btn" style="margin-top:10px">Carica audio</button></form></div><div class="panel"><h2>Stato</h2><p><b>${l.audio_path?"Audio pronto":"Audio da caricare"}</b></p><p class="muted">Il caricamento è locale. La trascrizione AI verrà collegata successivamente.</p></div></div>`;if(state.tab==="transcript")return editor("Trascrizione","transcript",l.transcript,"Incolla o modifica qui la trascrizione della lezione.");if(state.tab==="summary")return `<div class="panel"><div class="section-head"><h2>Riassunto</h2><button class="btn small" id="demoAI">Genera demo locale</button></div>${editorInner("summary",l.summary,"Scrivi o modifica il riassunto. La generazione AI reale verrà integrata dopo.")}</div>`;if(state.tab==="concepts")return `<div class="panel"><h2>Concetti principali</h2><p class="muted">Separali con virgole.</p><textarea id="concepts" class="form">${esc(l.concepts||"")}</textarea><button class="btn" id="saveConcepts" style="margin-top:10px">Salva concetti</button><div class="concepts" style="margin-top:15px">${(l.concepts||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div>`;if(state.tab==="map")return `<div class="panel"><h2>Mappa concettuale</h2><p class="muted">Vista locale dei concetti della lezione.</p><div class="map"><div class="node n1">${esc((l.concepts||"Concetto 1").split(",")[0]||"Concetto 1")}</div><div class="node n2">${esc((l.concepts||"Concetto 2").split(",")[1]||"Concetto 2")}</div><div class="center">${esc(l.title)}</div><div class="node n3">${esc((l.concepts||"Concetto 3").split(",")[2]||"Concetto 3")}</div><div class="node n4">${esc((l.concepts||"Concetto 4").split(",")[3]||"Concetto 4")}</div></div></div>`;if(state.tab==="flashcards")return flashTab(d);if(state.tab==="quiz")return quizTab(d);return tutorTab(d)}
function editor(title,key,value,ph){return `<div class="panel"><h2>${title}</h2>${editorInner(key,value,ph)}<button class="btn" id="saveEditor" style="margin-top:10px">Salva</button></div>`}
function editorInner(key,value,ph){return `<textarea id="editor" class="form" placeholder="${esc(ph)}">${esc(value||"")}</textarea>`}
function flashTab(d){const fs=d.flashcards;if(!fs.length)return `<div class="panel"><div class="section-head"><h2>Flashcard</h2><button class="btn" id="addFlash">＋ Crea flashcard</button></div><div class="empty">Nessuna flashcard.</div></div>`;const f=fs[Math.min(state.flashIndex,fs.length-1)];return `<div class="grid two"><div class="panel flash"><div><span class="pill">Flashcard ${state.flashIndex+1}/${fs.length}</span><h2>${esc(f.question)}</h2><p id="answer" class="hidden">${esc(f.answer)}</p><button class="btn" id="showAnswer">Mostra risposta</button><div style="margin-top:18px"><button class="btn ghost" id="prevF">←</button> <button class="btn ghost" id="nextF">→</button></div></div></div><div class="panel"><div class="section-head"><h2>Gestisci</h2><button class="btn" id="addFlash">＋ Nuova</button></div>${fs.map(x=>`<div class="lesson-row"><div class="grow"><b>${esc(x.question)}</b><div class="muted">${esc(x.answer)}</div></div><button class="btn danger small" data-del-f="${x.id}">×</button></div>`).join("")}</div></div>`}
function quizTab(d){const qs=d.questions;if(!qs.length)return `<div class="panel"><div class="section-head"><h2>Quiz</h2><button class="btn" id="addQ">＋ Crea domanda</button></div><div class="empty">Nessuna domanda.</div></div>`;const q=qs[Math.min(state.quizIndex,qs.length-1)];return `<div class="panel"><div class="section-head"><h2>Quiz ${state.quizIndex+1}/${qs.length}</h2><span class="pill">Punteggio ${state.quizScore}</span></div><h3>${esc(q.question)}</h3>${q.options.map((o,i)=>`<button class="quiz-option ${state.quizAnswers[q.id]===i?"selected":""}" data-opt="${i}">${esc(o)}</button>`).join("")}<div style="margin-top:15px"><button class="btn" id="nextQ">${state.quizIndex===qs.length-1?"Termina":"Prossima domanda"}</button></div></div>`}
function tutorTab(d){return `<div class="panel chat"><div><h2>Tutor AI</h2><p class="muted">Modalità locale demo. In seguito collegheremo il modello AI reale.</p></div><div id="chatMsgs"><div class="bubble">Ciao! Posso aiutarti a ripassare <b>${esc(d.lesson.title)}</b>. Chiedimi una definizione o chiedimi di spiegare il contenuto.</div></div><form class="chat-input" id="chatForm"><input id="chatInput" placeholder="Scrivi una domanda..."><button class="btn">Invia</button></form></div>`}
function bindLesson(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$("#backLesson").onclick=()=>{state.view="lessons";render()};$("#complete").onclick=async()=>{await api("/lessons/"+state.lessonId,{method:"PATCH",body:JSON.stringify({completed:!state.lesson.lesson.completed})});render()};if($("#audioForm"))$("#audioForm").onsubmit=async e=>{e.preventDefault();const f=$("#audioFile").files[0];if(!f)return;const fd=new FormData();fd.append("audio",f);try{await api("/lessons/"+state.lessonId+"/audio",{method:"POST",body:fd});toast("Audio caricato");render()}catch(err){toast(err.message)}};$("#removeAudio")?.addEventListener("click",async()=>{if(confirm("Rimuovere l'audio?")){await api("/lessons/"+state.lessonId+"/audio",{method:"DELETE"});render()}});$("#saveEditor")?.addEventListener("click",async()=>{const key=state.tab;await api("/lessons/"+state.lessonId,{method:"PATCH",body:JSON.stringify({[key]:$("#editor").value})});toast("Salvato");render()});$("#saveConcepts")?.addEventListener("click",async()=>{await api("/lessons/"+state.lessonId,{method:"PATCH",body:JSON.stringify({concepts:$("#concepts").value})});toast("Concetti salvati");render()});$("#demoAI")?.addEventListener("click",async()=>{try{await api("/lessons/"+state.lessonId+"/demo-ai",{method:"POST"});toast("Demo locale generata");render()}catch(e){toast(e.message)}});$("#addFlash")?.addEventListener("click",()=>flashModal());document.querySelectorAll("[data-del-f]").forEach(b=>b.onclick=async()=>{if(confirm("Eliminare flashcard?")){await api("/flashcards/"+b.dataset.delF,{method:"DELETE"});render()}});$("#showAnswer")?.addEventListener("click",()=>{$("#answer").classList.toggle("hidden");$("#showAnswer").textContent=$("#answer").classList.contains("hidden")?"Mostra risposta":"Nascondi risposta"});$("#prevF")?.addEventListener("click",()=>{state.flashIndex=(state.flashIndex-1+d.flashcards.length)%d.flashcards.length;render()});$("#nextF")?.addEventListener("click",()=>{state.flashIndex=(state.flashIndex+1)%d.flashcards.length;render()});$("#addQ")?.addEventListener("click",()=>questionModal());document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const q=d.questions[state.quizIndex];state.quizAnswers[q.id]=Number(b.dataset.opt);document.querySelectorAll("[data-opt]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("#nextQ")?.addEventListener("click",()=>{const q=d.questions[state.quizIndex];if(state.quizAnswers[q.id]===q.answer_index)state.quizScore++;if(state.quizIndex<d.questions.length-1)state.quizIndex++;else{toast("Quiz completato: "+state.quizScore+"/"+d.questions.length);state.quizIndex=0;state.quizScore=0;state.quizAnswers={}};render()});$("#chatForm")?.addEventListener("submit",e=>{e.preventDefault();const v=$("#chatInput").value.trim();if(!v)return;const box=$("#chatMsgs");box.innerHTML+=`<div class="bubble me">${esc(v)}</div><div class="bubble">Modalità demo: per ora posso rispondere solo in base ai contenuti che inserirai nella lezione. L'integrazione AI reale verrà aggiunta nella prossima fase.</div>`;$("#chatInput").value=""})}
function flashModal(){const m=modal("Nuova flashcard",`<form class="form" id="f"><input id="q" placeholder="Domanda" required><textarea id="a" placeholder="Risposta" required></textarea><button class="btn">Crea flashcard</button></form>`);m.querySelector("#f").onsubmit=async e=>{e.preventDefault();await api("/lessons/"+state.lessonId+"/flashcards",{method:"POST",body:JSON.stringify({question:m.querySelector("#q").value,answer:m.querySelector("#a").value})});m.remove();render()}}
function questionModal(){const m=modal("Nuova domanda quiz",`<form class="form" id="f"><input id="q" placeholder="Domanda" required><input id="a" placeholder="Opzione A" required><input id="b" placeholder="Opzione B" required><input id="c" placeholder="Opzione C"><input id="d" placeholder="Opzione D"><select id="correct"><option value="0">Corretta: A</option><option value="1">Corretta: B</option><option value="2">Corretta: C</option><option value="3">Corretta: D</option></select><button class="btn">Crea domanda</button></form>`);m.querySelector("#f").onsubmit=async e=>{e.preventDefault();const opts=[m.querySelector("#a").value,m.querySelector("#b").value,m.querySelector("#c").value,m.querySelector("#d").value].filter(Boolean);await api("/lessons/"+state.lessonId+"/questions",{method:"POST",body:JSON.stringify({question:m.querySelector("#q").value,options:opts,answer_index:Number(m.querySelector("#correct").value)})});m.remove();render()}}
async function loadStats(){const d=await api("/stats");document.getElementById("root").innerHTML=layout(`<div class="section-head"><h2>Statistiche</h2></div><div class="stats"><div class="panel stat"><strong>${d.courses}</strong><span>Corsi</span></div><div class="panel stat"><strong>${d.subjects}</strong><span>Materie</span></div><div class="panel stat"><strong>${d.lessons}</strong><span>Lezioni</span></div><div class="panel stat"><strong>${d.percent}%</strong><span>Completamento</span></div></div><div class="grid two section"><div class="panel"><h2>Progresso</h2><div class="progress" style="margin:20px 0"><i style="width:${d.percent}%"></i></div><p>${d.completed} lezioni completate su ${d.lessons}</p></div><div class="panel"><h2>Audio</h2><p style="font-size:28px;font-weight:900">${d.audio}</p><p class="muted">registrazioni caricate</p></div></div>`);bindCommon()}
async function loadCategory(){const d=await api("/dashboard");let title=state.view==="lessons"?"Lezioni":state.view==="notes"?"Appunti":state.view==="quiz"?"Quiz":"Mappe";document.getElementById("root").innerHTML=layout(`<div class="section-head"><h2>${title}</h2></div><div class="panel">${d.lessons.length?d.lessons.map(lessonRow).join(""):`<div class="empty">Nessun contenuto disponibile.</div>`}</div>`);bindCommon();bindRows()}
render();
</script>
</body>
</html>
